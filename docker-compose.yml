services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    volumes:
      # EBS 마운트 포인트 (/data) → ChromaDB 영구 저장
      - chroma_data:/data/chroma_db
      # BGE 모델 캐시 재사용 (콜드스타트 단축)
      - hf_cache:/root/.cache/huggingface
    environment:
      - LLM_BACKEND=${LLM_BACKEND:-local}

  # Next.js UI. app 서비스 이름으로 컨테이너 간 통신하므로 localhost가 아닌
  # 서비스명(app)을 BACKEND_URL로 사용 — frontend/app/api/*/route.ts가 이 값으로 프록시.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BACKEND_URL=http://app:8765
      - BUNPIL_API_KEY=${BUNPIL_API_KEY}
    depends_on:
      - app

volumes:
  chroma_data:
  hf_cache:
