  <line x1="550" y1="132" x2="562" y2="132" stroke="#3A3F4A" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="565" y="110" width="195" height="44" rx="12" fill="#1B1F27" stroke="#2E3440"/>
  <text x="662" y="137" text-anchor="middle" font-size="12" fill="#E6E8EB">GET /status/job_id</text>

  <path d="M115,140 C 115,200 150,200 150,260" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M590,200 C 590,230 400,230 400,260" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

