  <text x="115" y="129" text-anchor="middle" font-size="11" fill="#9CA3AF">read timeout 35s</text>
  <line x1="210" y1="115" x2="227" y2="115" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>

