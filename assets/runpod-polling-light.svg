<svg width="950" height="350" viewBox="0 0 950 350" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Pretendard, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8B6AC"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B9A0E8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E29AA6"/>
    </marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1A1A1A" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="950" height="350" fill="#FFFFFF"/>

  <rect x="20" y="90" width="190" height="50" rx="12" fill="#F7F7F5" stroke="#E4E2DC" filter="url(#s)"/>
  <text x="115" y="111" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">POST /run</text>
  <text x="115" y="129" text-anchor="middle" font-size="11" fill="#6B7280">read timeout 35s</text>
  <line x1="210" y1="115" x2="227" y2="115" stroke="#B8B6AC" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="230" y="90" width="150" height="50" rx="12" fill="#F7F7F5" stroke="#E4E2DC" filter="url(#s)"/>
  <text x="305" y="120" text-anchor="middle" font-size="12.5" fill="#374151">job_id 수신</text>
  <line x1="380" y1="115" x2="397" y2="115" stroke="#B8B6AC" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="400" y="30" width="380" height="170" rx="20" fill="#FAFAF9" stroke="#E4E2DC" filter="url(#s)"/>
  <text x="420" y="58" font-size="12.5" font-weight="700" fill="#78716C">🔁 최대 60회 · 5초 간격(최대 5분)</text>

  <path d="M485,110 C 485,80 573,80 573,110" fill="none" stroke="#C3C2B7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="529" y="76" text-anchor="middle" font-size="9.5" fill="#78716C">IN_QUEUE / IN_PROGRESS</text>

  <rect x="420" y="110" width="130" height="44" rx="12" fill="#FFFFFF" stroke="#E4E2DC"/>
  <text x="485" y="137" text-anchor="middle" font-size="12" fill="#374151">5초 대기</text>
  <line x1="550" y1="132" x2="562" y2="132" stroke="#C3C2B7" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="565" y="110" width="195" height="44" rx="12" fill="#FFFFFF" stroke="#E4E2DC"/>
  <text x="662" y="137" text-anchor="middle" font-size="12" fill="#374151">GET /status/job_id</text>

  <path d="M115,140 C 115,200 150,200 150,260" fill="none" stroke="#B8B6AC" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M590,200 C 590,230 400,230 400,260" fill="none" stroke="#B8B6AC" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <path d="M662,154 C 662,200 605,200 605,260" fill="none" stroke="#B9A0E8" stroke-width="1.5" marker-end="url(#ap)"/>
  <path d="M662,154 C 662,200 815,200 815,260" fill="none" stroke="#E29AA6" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="605" y="216" text-anchor="middle" font-size="9.5" fill="#6D28D9">COMPLETED</text>
  <text x="815" y="216" text-anchor="middle" font-size="9.5" fill="#B0455A">FAILED/CANCELLED</text>

  <rect x="20" y="260" width="260" height="50" rx="12" fill="#FEE2E2" stroke="#F1B4B4" filter="url(#s)"/>
  <text x="150" y="281" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B0455A">⚠️ TimeoutError</text>
  <text x="150" y="299" text-anchor="middle" font-size="10.5" fill="#B0455A">제출 타임아웃 · 재제출 안 함</text>

  <rect x="310" y="260" width="180" height="50" rx="12" fill="#FEE2E2" stroke="#F1B4B4" filter="url(#s)"/>
  <text x="400" y="281" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B0455A">⚠️ TimeoutError</text>
  <text x="400" y="299" text-anchor="middle" font-size="10.5" fill="#B0455A">60회 초과</text>

  <rect x="520" y="260" width="170" height="50" rx="12" fill="#EDE9FE" stroke="#D6C6F5" filter="url(#s)"/>
  <text x="605" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6D28D9">✅ output 반환</text>

  <rect x="730" y="260" width="170" height="50" rx="12" fill="#FEE2E2" stroke="#F1B4B4" filter="url(#s)"/>
  <text x="815" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B0455A">❌ 예외 발생</text>
</svg>
